name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: List files for debugging
        run: ls -la

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # البحث التلقائي عن المجلد الذي يحتوي على package.json
          PROJECT_DIR=$(find extracted_project -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found in ZIP!"
            exit 1
          fi
          echo "Project directory is: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "Current directory: $(pwd)"
          npm install
          npm run apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumera-care-debug
          path: |
            **/*.apk
            **/build/outputs/apk/debug/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
        if: always()
